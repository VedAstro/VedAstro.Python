#  workflow automates the Python package publishing process
# to PyPI upon pushes to the main branch or manual triggers,
# auto-bumps version before publishing.

name: Publish to PyPI
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'pyproject.toml'
      - 'setup.py'
  workflow_dispatch:

concurrency:
  group: pypi-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GH_TOKEN }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry

    - name: Choose a fresh release version
      run: |
        python - <<'PY'
        import json, os, tomllib, urllib.request
        from packaging.version import Version
        with urllib.request.urlopen('https://pypi.org/pypi/vedastro/json', timeout=30) as response:
            published = Version(json.load(response)['info']['version'])
        with open('pyproject.toml', 'rb') as source:
            local = Version(tomllib.load(source)['tool']['poetry']['version'])
        current = max(published, local)
        version = f'{current.major}.{current.minor}.{current.micro + 1}'
        with open(os.environ['GITHUB_ENV'], 'a') as output:
            output.write(f'NEW_VERSION={version}\n')
        print(f'Releasing {version}')
        PY

    - name: Update version in pyproject.toml
      run: |
        sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" pyproject.toml

    - name: Update version in setup.py
      run: |
        sed -i "s/version='.*'/version='$NEW_VERSION'/" setup.py

    - name: Re-run poetry lockfile
      run: poetry lock

    - name: Install project dependencies
      run: poetry install

    - name: Build package
      run: poetry build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip-existing: true

    - name: Commit version bump
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add pyproject.toml setup.py poetry.lock
        if git diff --cached --quiet; then
          echo "Version files are already current."
        else
          git commit -m "Auto bump version to $NEW_VERSION"
          git pull --rebase origin main
          git push origin main
        fi
